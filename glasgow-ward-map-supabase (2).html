<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WFS GP Programme - Practice Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <style>
    .marker-cluster-small  { background-color: rgba(42,127,135,0.25); }
    .marker-cluster-medium { background-color: rgba(26,46,68,0.25); }
    .marker-cluster-large  { background-color: rgba(231,76,60,0.25); }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: rgba(42,127,135,0.85); color: white;
      font-weight: 700; font-size: 0.78rem; font-family: 'Segoe UI', system-ui, sans-serif;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a2e44; --teal: #2a7f87; --teal-lt: #e6f4f5; --teal-dk: #1d5f65;
      --slate: #4a6278; --sand: #f5f3ef; --white: #ffffff; --border: #d0dae3;
      --text: #1c2b3a; --muted: #6b8099; --accent: #c0392b;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--sand); color: var(--text); }
    .app { display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--navy); color: var(--white); padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .hdr-badge { background: var(--teal); border-radius: 6px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    header p { font-size: 0.72rem; opacity: 0.6; margin-top: 1px; }
    .hdr-right { margin-left: auto; font-size: 0.72rem; opacity: 0.55; text-align: right; white-space: nowrap; }
    .main { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: 290px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; z-index: 500; }
    .sb-head { padding: 12px 14px 10px; background: var(--sand); border-bottom: 1px solid var(--border); }
    .sb-head h2 { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .sb-total { font-size: 0.8rem; color: var(--text); margin-top: 3px; font-weight: 600; }
    .sb-search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .sb-search input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.8rem; color: var(--text); outline: none; }
    .sb-search input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(42,127,135,0.15); }
    #area-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .area-group { border-bottom: 1px solid var(--border); }
    .area-group-header { padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: var(--white); transition: background 0.15s; border-left: 3px solid transparent; user-select: none; }
    .area-group-header:hover { background: var(--teal-lt); }
    .area-group-header.active { background: var(--teal-lt); border-left-color: var(--teal); }
    .area-name { font-size: 0.85rem; font-weight: 600; }
    .area-ward-tag { font-size: 0.65rem; color: var(--muted); font-weight: 400; display: block; margin-top: 1px; }
    .area-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .area-count { font-size: 0.68rem; font-weight: 700; background: var(--teal-lt); color: var(--teal); border-radius: 20px; padding: 1px 7px; }
    .area-chevron { font-size: 0.65rem; color: var(--muted); transition: transform 0.2s; }
    .area-chevron.open { transform: rotate(90deg); }
    .practice-list { display: none; background: #f9fbfc; }
    .practice-list.open { display: block; }
    .practice-item { padding: 7px 14px 7px 22px; font-size: 0.78rem; color: var(--slate); border-top: 1px solid var(--border); cursor: pointer; display: flex; align-items: flex-start; gap: 7px; transition: background 0.12s; }
    .practice-item:hover { background: var(--teal-lt); color: var(--teal-dk); }
    .practice-item.active { background: var(--teal-lt); color: var(--teal-dk); font-weight: 600; }
    .practice-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink: 0; margin-top: 4px; }
    .sb-foot { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--muted); }
    .legend { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .legend-pin { width: 12px; height: 12px; border-radius: 50%; background: var(--teal); border: 2px solid white; box-shadow: 0 0 0 1.5px var(--teal); }
    .legend-ward { width: 14px; height: 10px; background: rgba(42,127,135,0.2); border: 1.5px solid var(--teal); border-radius: 2px; }
    .legend-ward-grey { width: 14px; height: 10px; background: rgba(148,175,192,0.15); border: 1.5px solid #94afc0; border-radius: 2px; }
    #map { flex: 1; }
    .leaflet-popup-content-wrapper { border-radius: 8px !important; box-shadow: 0 6px 24px rgba(26,46,68,0.18) !important; padding: 0 !important; }
    .leaflet-popup-content { margin: 0 !important; }
    .gp-popup { font-family: 'Segoe UI', system-ui, sans-serif; min-width: 240px; max-width: 300px; }
    .gp-popup-hdr { background: var(--navy); color: var(--white); padding: 11px 14px 9px; border-radius: 8px 8px 0 0; }
    .gp-popup-hdr h3 { font-size: 0.88rem; font-weight: 700; line-height: 1.35; }
    .area-tag { display: inline-block; margin-top: 4px; font-size: 0.67rem; background: rgba(255,255,255,0.18); padding: 2px 8px; border-radius: 20px; }
    .ward-tag { display: inline-block; margin-top: 2px; margin-left: 4px; font-size: 0.67rem; background: rgba(42,127,135,0.5); padding: 2px 8px; border-radius: 20px; }
    .gp-popup-body { padding: 11px 14px; }
    .gp-field { margin-bottom: 7px; font-size: 0.8rem; }
    .gp-field label { display: block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 1px; }
    .gp-field span { display: block; color: var(--text); }
    .gp-field a { color: var(--teal); text-decoration: none; }
    .gp-field a:hover { text-decoration: underline; }
    .gp-toggle { width: 100%; margin-top: 4px; background: var(--teal-lt); border: 1px solid var(--teal); color: var(--teal); font-size: 0.74rem; font-weight: 600; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s, color 0.15s; }
    .gp-toggle:hover { background: var(--teal); color: white; }
    .gp-contacts { display: none; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
    .gp-contacts.open { display: block; }
    .contact-row { background: var(--sand); border-radius: 5px; padding: 7px 9px; margin-bottom: 5px; font-size: 0.76rem; }
    .contact-row strong { display: block; color: var(--navy); font-size: 0.78rem; }
    .contact-row em { display: block; font-size: 0.68rem; font-style: normal; color: var(--muted); margin-bottom: 2px; }
    .contact-row a { color: var(--teal); text-decoration: none; display: block; font-size: 0.73rem; }
    .gp-pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--teal); border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .gp-pin span { transform: rotate(45deg); font-size: 10px; font-weight: 900; color: white; line-height: 1; }
    .gp-pin.selected { background: var(--accent) !important; }
    .ward-tooltip { background: rgba(26,46,68,0.85); color: white; border: none; border-radius: 4px; font-size: 0.72rem; padding: 3px 8px; }
    .ward-tooltip::before { display: none; }
  </style>
</head>

<div class="app">
  <header>
    <div class="hdr-badge">+</div>
    <div>
      <h1>WFS GP Programme - Practice Map</h1>

    <div class="hdr-right">24 practices - 15 areas<br>23 ward boundaries</div>

  <div class="main">
    <div id="sidebar">

      </div>
      <div class="sb-search">
        <input type="text" id="search-input" placeholder="Search practice, area or postcode..." />
      </div>
      <div id="area-list"></div>
      <div class="sb-foot">
        <div class="legend"><div class="legend-pin"></div> GP Practice</div>
        <div class="legend"><div class="legend-ward"></div> Ward with practices</div>
        <div class="legend"><div class="legend-ward-grey"></div> Other Glasgow ward</div>
        <div style="margin-top:5px;">Click a ward or practice to explore.</div>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

var ACTIVE_WARDS = {};
Object.keys(AREA_TO_WARD).forEach(function(a) { ACTIVE_WARDS[AREA_TO_WARD[a]] = true; });

var map = L.map('map', {center:[55.855,-4.250], zoom:11});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19
}).addTo(map);

var wardLayers = {};
var activeWard = null;

var WARD_COLOURS = {
    'Drumchapel/Anniesland': '#f5c518',
    'Garscadden/Scotstounhill': '#f5c518',
    'Canal': '#e74c3c',
    'Springburn/Robroyston': '#e74c3c',
    'North East': '#27ae60',
    'East Centre': '#27ae60',
    'Calton': '#27ae60',
    'Easterhouse': '#27ae60',
    'Govan': '#2980b9',
    'Greater Pollok': '#2980b9',
    'Southside Central': '#e91e8c',
    'Linn': '#e91e8c',
  };
  function wardStyle(name, hover, selected) {
    var active = ACTIVE_WARDS[name] ? true : false;
    var wardCol = WARD_COLOURS[name] || '#94afc0';
    return {
      color:       selected ? '#1a2e44' : (hover ? '#333' : '#666'),
      weight:      selected ? 2.5 : (hover ? 2.0 : 1.5),
      opacity:     0.8,
      fillColor:   wardCol,
      fillOpacity: selected ? 0.45 : (hover ? 0.40 : 0.25),
    };
  }

function selectWard(name) {
  if (activeWard && wardLayers[activeWard]) {
    wardLayers[activeWard].setStyle(wardStyle(activeWard, false, false));
  }
  activeWard = name;
  if (wardLayers[name]) {
    wardLayers[name].setStyle(wardStyle(name, false, true));
    wardLayers[name].bringToFront();
    map.fitBounds(wardLayers[name].getBounds(), {padding:[40,40], maxZoom:14});
  }
}

// Filter out the duplicate Dennistoun2 test entry
var realFeatures = WARD_GEOJSON.features.filter(function(f) { return f.properties.name !== 'Dennistoun2'; });
WARD_GEOJSON.features = realFeatures;

L.geoJSON(WARD_GEOJSON, {
  style: function(feature) { return wardStyle(feature.properties.name, false, false); },
  onEachFeature: function(feature, layer) {
    var name = feature.properties.name;
    wardLayers[name] = layer;
    layer.bindTooltip(name, {sticky:true, opacity:0.9, className:'ward-tooltip'});
    layer.on({
      mouseover: function(e) { if (activeWard !== name) { e.target.setStyle(wardStyle(name, true, false)); } },
      mouseout:  function(e) { if (activeWard !== name) { e.target.setStyle(wardStyle(name, false, false)); } },
      click:     function()  { selectWard(name); }
    });
  }
}).addTo(map);

  return L.divIcon({

    className:'', iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-28]

}

function buildContactsHTML(p) {
  if (!p.contacts || p.contacts.length === 0) {
    return '<div style="font-size:0.75rem;color:#6b8099;padding:4px 0;">No contact persons on record yet</div>';
  }
  var html = '';
  for (var i = 0; i < p.contacts.length; i++) {
    var c = p.contacts[i];
    html += '<div class="contact-row">';
    html += '<strong>' + c.name + '</strong>';
    html += '<em>' + c.role + '</em>';
    if (c.phone) { html += '<a href="tel:' + c.phone + '">Tel: ' + c.phone + '</a>'; }
    if (c.email) { html += '<a href="mailto:' + c.email + '">Email: ' + c.email + '</a>'; }
    html += '</div>';
  }
  return html;
}

  html += '<span class="area-tag">' + p.area + '</span>';
  html += '<span class="ward-tag">Ward: ' + wardName + '</span>';
  html += '</div>';
  html += '<div class="gp-popup-body">';
  html += '<div class="gp-field"><label>Address</label><span>' + p.address + '</span></div>';
  html += '<div class="gp-field"><label>Postcode</label><span><a href="' + mapsUrl + '" target="_blank">' + p.postcode + '</a></span></div>';
  html += '<button class="gp-toggle" onclick="toggleContacts(' + p.id + ')"><span>Contact persons (' + p.contacts.length + ')</span><span id="arr-' + p.id + '">v</span></button>';
  html += '<div class="gp-contacts" id="ct-' + p.id + '">' + buildContactsHTML(p) + '</div>';
  html += '</div></div>';
  return html;
}

GP_PRACTICES.forEach(function(p) {
  var marker = L.marker([p.lat, p.lng], {icon: makeIcon(p.id), zIndexOffset:1000})
    .addTo(map)
    .bindPopup(buildPopupHTML(p), {maxWidth:320, minWidth:250});

  marker.on('popupopen', function() {
    highlightSidebarItem(p.id);
    var pins = document.querySelectorAll('.gp-pin');
    for (var i = 0; i < pins.length; i++) { pins[i].classList.remove('selected'); }
    var pin = document.getElementById('pin-' + p.id);
    if (pin) { pin.classList.add('selected'); }
    var wn = AREA_TO_WARD[p.area];
    if (wn) { selectWard(wn); }
  });

  marker.on('popupclose', function() {
    var pin = document.getElementById('pin-' + p.id);
    if (pin) { pin.classList.remove('selected'); }
    var items = document.querySelectorAll('.practice-item');
    for (var i = 0; i < items.length; i++) { items[i].classList.remove('active'); }
    if (activeWard && wardLayers[activeWard]) {
      wardLayers[activeWard].setStyle(wardStyle(activeWard, false, false));
      activeWard = null;
    }
  });

  markerMap[p.id] = marker;
});

window.toggleContacts = function(id) {
  var panel = document.getElementById('ct-' + id);
  var arrow = document.getElementById('arr-' + id);
  if (!panel) { return; }
  var isOpen = panel.classList.toggle('open');
  if (arrow) { arrow.textContent = isOpen ? '^' : 'v'; }
};

var openAreas = {};

function groupByArea(list) {
  var groups = {};
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (!groups[p.area]) { groups[p.area] = []; }
    groups[p.area].push(p);
  }
  return groups;
}

function buildSidebar(filter) {
  filter = filter || '';
  var lf = filter.toLowerCase();
  var listEl = document.getElementById('area-list');
  listEl.innerHTML = '';

  var filtered = [];
  for (var i = 0; i < GP_PRACTICES.length; i++) {
    var p = GP_PRACTICES[i];
    var ward = AREA_TO_WARD[p.area] || '';
    if (p.name.toLowerCase().indexOf(lf) >= 0 ||
        p.area.toLowerCase().indexOf(lf) >= 0 ||
        p.postcode.toLowerCase().indexOf(lf) >= 0 ||
        ward.toLowerCase().indexOf(lf) >= 0) {
      filtered.push(p);
    }
  }

  var groups = groupByArea(filtered);
  var areaKeys = Object.keys(groups).sort();
  var countEl = document.getElementById('sb-count');
  countEl.textContent = filtered.length + ' practice' + (filtered.length !== 1 ? 's' : '') +
    ' across ' + areaKeys.length + ' area' + (areaKeys.length !== 1 ? 's' : '');

  for (var ai = 0; ai < areaKeys.length; ai++) {
    var area = areaKeys[ai];
    var practices = groups[area];
    var wardName = AREA_TO_WARD[area] || '';
    var isOpen = openAreas[area] || filter.length > 0;

    var groupEl = document.createElement('div');
    groupEl.className = 'area-group';

    var header = document.createElement('div');
    header.className = 'area-group-header' + (isOpen ? ' active' : '');
    var headerInner = '<div><span class="area-name">' + area + '</span>';
    if (wardName) { headerInner += '<span class="area-ward-tag">Ward: ' + wardName + '</span>'; }
    headerInner += '</div><span class="area-meta"><span class="area-count">' + practices.length + '</span>';
    headerInner += '<span class="area-chevron' + (isOpen ? ' open' : '') + '">></span></span>';
    header.innerHTML = headerInner;

    (function(a, wn) {
      header.addEventListener('click', function() {
        if (openAreas[a]) { delete openAreas[a]; } else { openAreas[a] = true; }
        buildSidebar(document.getElementById('search-input').value);
        if (wn && wardLayers[wn]) { selectWard(wn); }
      });
    })(area, wardName);

    var practiceListEl = document.createElement('div');
    practiceListEl.className = 'practice-list' + (isOpen ? ' open' : '');

    for (var pi = 0; pi < practices.length; pi++) {
      (function(pr) {
        var item = document.createElement('div');
        item.className = 'practice-item';
        item.setAttribute('data-id', pr.id);
        item.innerHTML = '<div class="practice-dot"></div><span>' + pr.name + '</span>';
        item.addEventListener('click', function() {
          map.setView([pr.lat, pr.lng], 15);
          setTimeout(function() { markerMap[pr.id].openPopup(); }, 200);
        });
        practiceListEl.appendChild(item);
      })(practices[pi]);
    }

    groupEl.appendChild(header);
    groupEl.appendChild(practiceListEl);
    listEl.appendChild(groupEl);
  }
}

function highlightSidebarItem(id) {
  var items = document.querySelectorAll('.practice-item');
  for (var i = 0; i < items.length; i++) {
    var el = items[i];
    if (parseInt(el.getAttribute('data-id')) === id) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  }
  var p = null;
  for (var j = 0; j < GP_PRACTICES.length; j++) {
    if (GP_PRACTICES[j].id === id) { p = GP_PRACTICES[j]; break; }
  }
  if (p && !openAreas[p.area]) {
    openAreas[p.area] = true;
    buildSidebar(document.getElementById('search-input').value);
  }
}

document.getElementById('search-input').addEventListener('input', function(e) {
  buildSidebar(e.target.value);
});

buildSidebar();
</script>

<style>

  #act-count-badge {

  /* Sidebar filters */
  #act-filter-bar { padding: 8px 12px 10px; border-bottom: 1px solid #d0dae3; background: #f0faf0; display: none; }
  #act-filter-bar.visible { display: block; }

  }
  #act-sync-btn:hover { background: #0f1e2e; }
  #act-sync-btn:disabled { background: #6b8099; cursor: not-allowed; }
</style>

<script>
  // ============================================================
  // Supabase configuration
  // ============================================================
  var SUPABASE_URL  = 'https://vpksaudahfueilxqafzr.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwa3NhdWRhaGZ1ZWlseHFhZnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzU3NDMsImV4cCI6MjEwNDcxMTc0M30.j3b0TcAxr_4DX67wLy80douBxc4toGLC-1VU5rt4_hQ';
  // ============================================================

  var ACT_COLOURS = {
    'Tennis': '#f39c12', 'Gymnastics': '#e91e8c', 'Walking': '#27ae60',
    'Exercise Class': '#8e44ad', 'Disability Sport': '#e67e22',
    'Football': '#2ecc71', 'Basketball': '#e74c3c', 'Karate': '#d35400',
    'Seated Exercise': '#9b59b6', 'Badminton': '#1abc9c', 'Boxing': '#c0392b',
    'Taekwondo': '#e08600', 'Netball': '#e91e63', 'Athletics': '#3498db',
    'Cricket': '#006400', 'Cycling': '#00bcd4', 'Table Tennis': '#ff5722',
    'Dance': '#ff4081', 'Pickleball': '#16a085', 'Running': '#2196f3',
    'Squash': '#795548', 'Archery': '#607d8b', 'Wrestling': '#b71c1c',
    'Volleyball': '#ff9800', 'Tai Chi': '#4caf50', 'Judo': '#5d4037',
    'Fencing': '#455a64', 'Rugby Union': '#1b5e20', 'Hockey': '#0277bd',
    'Yoga': '#7b1fa2', 'Trampolining': '#f06292', 'Handball': '#0097a7',
    'Bowls': '#558b2f', 'Korfball': '#e53935'
  };

  function getActColour(type) {
    if (ACT_COLOURS[type]) return ACT_COLOURS[type];
    for (var k in ACT_COLOURS) {
      if (type && type.toLowerCase().indexOf(k.toLowerCase()) >= 0) return ACT_COLOURS[k];
    }
    return '#546e7a';
  }

  var actLayerGroup = L.markerClusterGroup({
    showCoverageOnHover: false,
    maxClusterRadius: 40,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 16,
    iconCreateFunction: function(cluster) {
      var count = cluster.getChildCount();
      var size = count < 10 ? 'small' : count < 50 ? 'medium' : 'large';
      return L.divIcon({
        html: '<div><span>' + count + '</span></div>',
        className: 'marker-cluster marker-cluster-' + size,
        iconSize: [40, 40]
      });
    }
  });
  var ALL_ACTIVITIES = [];
  var currentType = 'all', currentOrg = 'all';

  function buildActPopup(a) {
    var col = getActColour(a.activity_type);
    var h = '<div class="act-popup">';
    h += '<div class="act-popup-hdr" style="background:' + col + ';">';
    h += '<h3>' + (a.name || '') + '</h3>';
    h += '<span class="act-type-tag">' + (a.activity_type || '') + '</span>';
    h += '</div><div class="act-popup-body">';
    if (a.venue)     h += '<div class="act-field"><label>Venue</label><span>' + a.venue + '</span></div>';
    if (a.organiser) h += '<div class="act-field"><label>Organiser</label><span>' + a.organiser + '</span></div>';
    if (a.address)   h += '<div class="act-field"><label>Address</label><span>' + a.address + '</span></div>';
    h += '<div class="act-field"><label>Price</label><span>' + (a.price || 'See website') + '</span></div>';
    if (a.age && a.age !== 'All ages') h += '<div class="act-field"><label>Age</label><span>' + a.age + '</span></div>';
    if (a.gender && a.gender !== 'No restriction') h += '<div class="act-field"><label>Gender</label><span>' + a.gender + '</span></div>';
    if (a.next_date) h += '<div class="act-field"><label>Next session</label><span>' + a.next_date + '</span></div>';
    if (a.url)       h += '<div class="act-field"><label>Book / Info</label><span><a href="' + a.url + '" target="_blank">View listing ↗</a></span></div>';
    if (a.description) h += '<div class="act-desc">' + a.description + '</div>';
    h += '</div></div>';
    return h;
  }

  function renderActMarkers(typeFilter, orgFilter) {
    actLayerGroup.clearLayers();
    var count = 0;
    ALL_ACTIVITIES.forEach(function(a) {
      if (typeFilter && typeFilter !== 'all' && a.activity_type !== typeFilter) return;
      if (orgFilter  && orgFilter  !== 'all' && a.organiser    !== orgFilter)  return;
      if (!a.lat || !a.lng) return;
      var col  = getActColour(a.activity_type);
      var icon = L.divIcon({
        html: '<div class="act-dot" style="background:' + col + ';"></div>',
        className: '', iconSize: [14,14], iconAnchor: [7,7], popupAnchor: [0,-10]
      });
      L.marker([a.lat, a.lng], { icon: icon, zIndexOffset: 500 })
        .bindPopup(buildActPopup(a), { maxWidth: 300, minWidth: 240 })
        .addTo(actLayerGroup);
      count++;
    });
    var badge = document.getElementById('act-count-badge');
    if (badge) badge.textContent = count;
  }

  function getUniqueValues(key) {
    var seen = {};
    ALL_ACTIVITIES.forEach(function(a) {
      if (a[key]) seen[a[key]] = (seen[a[key]] || 0) + 1;
    });
    return Object.entries(seen).sort(function(a,b) { return a[0].localeCompare(b[0]); });
  }

  function rebuildFilters() {
    var typeSel = document.getElementById('act-type-filter');
    var orgSel  = document.getElementById('act-org-filter');
    typeSel.innerHTML = '';
    orgSel.innerHTML  = '';

    var makeOpt = function(val, label) {
      var o = document.createElement('option');
      o.value = val; o.textContent = label; return o;
    };

    typeSel.appendChild(makeOpt('all', 'All activity types (' + ALL_ACTIVITIES.length + ')'));
    getUniqueValues('activity_type').forEach(function(e) {
      typeSel.appendChild(makeOpt(e[0], e[0] + ' (' + e[1] + ')'));
    });

    orgSel.appendChild(makeOpt('all', 'All organisers (' + ALL_ACTIVITIES.length + ')'));
    getUniqueValues('organiser').forEach(function(e) {
      orgSel.appendChild(makeOpt(e[0], e[0] + ' (' + e[1] + ')'));
    });
  }

  async function fetchFromSupabase() {
    var loader = document.getElementById('act-loading');
    var syncBtn = document.getElementById('act-sync-btn');
    if (loader)  loader.style.display  = 'flex';
    if (syncBtn) { syncBtn.disabled = true; syncBtn.textContent = '↺ Refreshing…'; }

    try {
      var res = await fetch(
        SUPABASE_URL + '/rest/v1/activities?select=*&order=activity_type.asc',
        { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON } }
      );
      if (!res.ok) throw new Error('Supabase returned HTTP ' + res.status);
      ALL_ACTIVITIES = await res.json();

      // Last synced timestamp
      var maxSync = ALL_ACTIVITIES.reduce(function(max, a) {
        return (a.synced_at > max) ? a.synced_at : max;
      }, '');
      var syncEl = document.getElementById('act-last-synced');
      if (syncEl && maxSync) {
        syncEl.textContent = 'Data synced: ' + new Date(maxSync).toLocaleDateString('en-GB', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
      }

      rebuildFilters();
      renderActMarkers(currentType, currentOrg);
      console.log('Loaded ' + ALL_ACTIVITIES.length + ' activities from Supabase');

    } catch(err) {
      console.error('Failed to load activities:', err);
      var badge = document.getElementById('act-count-badge');
      if (badge) badge.textContent = 'error';
      alert('Could not load activity data from Supabase.\n\nError: ' + err.message);
    } finally {
      if (loader) loader.style.display = 'none';
      if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = '↺ Refresh data'; }
    }
  }

  window.addEventListener('load', function() {
    // Loading spinner
    var loader = document.createElement('div');
    loader.id = 'act-loading';
    loader.innerHTML = '<div class="act-spinner"></div> Loading activities…';
    document.getElementById('map').appendChild(loader);

    actLayerGroup.addTo(map);

    // Layer control (bottom-right)
    var ctrl = document.createElement('div');
    ctrl.id = 'layer-ctrl';
    ctrl.innerHTML =
      '<h4>Map Layers</h4>' +
      '<div class="layer-row">' +
        '<input type="checkbox" id="tog-gp" checked>' +
        '<div class="layer-swatch" style="background:#2a7f87;"></div>' +
        '<label for="tog-gp">GP Practices</label>' +
      '</div>' +
      '<div class="layer-row">' +
        '<input type="checkbox" id="tog-act" checked>' +
        '<div class="layer-swatch" style="background:#27ae60;"></div>' +
        '<label for="tog-act">Activities <span id="act-count-badge">…</span></label>' +
      '</div>' +
      '<div id="act-last-synced"></div>';
    document.getElementById('map').appendChild(ctrl);

    document.getElementById('tog-gp').addEventListener('change', function() {
      if (typeof markerMap !== 'undefined') {
        Object.values(markerMap).forEach(function(m) {
          if (this.checked) m.addTo(map); else map.removeLayer(m);
        }.bind(this));
      }
    });

    document.getElementById('tog-act').addEventListener('change', function() {
      var filterBar = document.getElementById('act-filter-bar');
      if (this.checked) {
        actLayerGroup.addTo(map);
        if (filterBar) filterBar.classList.add('visible');
      } else {
        map.removeLayer(actLayerGroup);
        if (filterBar) filterBar.classList.remove('visible');
      }
    });

    // Sidebar filters
    var filterBar = document.createElement('div');
    filterBar.id = 'act-filter-bar';
    filterBar.className = 'visible';
    filterBar.innerHTML =
      '<span class="filter-lbl">Activity type</span>' +
      '<select id="act-type-filter"></select>' +
      '<span class="filter-lbl">Organiser</span>' +
      '<select id="act-org-filter"></select>' +
      '<button id="act-sync-btn">↺ Refresh data</button>';

    var sbSearch = document.querySelector('.sb-search');
    if (sbSearch) sbSearch.parentNode.insertBefore(filterBar, sbSearch.nextSibling);

    document.getElementById('act-type-filter').addEventListener('change', function() {
      currentType = this.value; renderActMarkers(currentType, currentOrg);
    });
    document.getElementById('act-org-filter').addEventListener('change', function() {
      currentOrg = this.value; renderActMarkers(currentType, currentOrg);
    });
    document.getElementById('act-sync-btn').addEventListener('click', function() {
      fetchFromSupabase();
    });

    // Initial load
    fetchFromSupabase();
  });
</script>

</body>
